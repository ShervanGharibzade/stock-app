name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check API key
        run: |
          if [ -z "$NEXT_PUBLIC_APP_API_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_APP_API_KEY is missing"
            exit 1
          fi
          echo "API key is configured"
        env:
          NEXT_PUBLIC_APP_API_KEY: ${{ secrets.POLYGON_API_KEY }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          NEXT_PUBLIC_APP_BASE_URL: https://api.polygon.io/v1/indicators/sma

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
